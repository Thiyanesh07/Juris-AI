[project]
name = "legalgraph-api"
version = "0.1.0"
description = "FastAPI foundation for Indian legal multi-hop research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "itsdangerous>=2.2,<3.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pymupdf>=1.24,<2.0",
    "numpy>=2.0,<3.0",
    "neo4j>=5.26,<6.0",
    "faiss-cpu>=1.10,<2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
    "torch>=2.6,<3.0",
    "transformers>=4.48,<5.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI's Depends() default is the framework's documented pattern.

[tool.ruff.lint.per-file-ignores]
# conftest pins the test DATABASE_URL before importing app modules.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
