version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: juris_ai_postgres
    profiles: ["infra", "app"]
    environment:
      POSTGRES_USER: legalgraph
      POSTGRES_PASSWORD: legalgraph
      POSTGRES_DB: legalgraph
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalgraph -d legalgraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: juris_ai_neo4j
    profiles: ["infra", "app"]
    environment:
      NEO4J_AUTH: neo4j/legalgraph
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7475:7474" # HTTP Web Console
      - "7688:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data

  api:
    build:
      context: ./server/api
      dockerfile: Dockerfile
    container_name: juris_ai_backend
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql+asyncpg://legalgraph:legalgraph@postgres:5432/legalgraph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: legalgraph
      FRONTEND_URL: http://localhost:3001
      SESSION_SECRET: replace-with-a-long-random-secret-key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

volumes:
  postgres_data:
  neo4j_data:
